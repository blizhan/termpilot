[project]
name = "termpilot-plugin"
version = "0.1.0"
description = "Give ChatGPT eyes and hands in your terminal"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "iterm2>=2.2,<3",
    "mcp>=2,<3",
]

[project.scripts]
termpilot = "termpilot.main:main"

[project.urls]
Homepage = "https://github.com/blizhan/termpilot"
Repository = "https://github.com/blizhan/termpilot"
Issues = "https://github.com/blizhan/termpilot/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/termpilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
